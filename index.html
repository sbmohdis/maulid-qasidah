<style>
:root{--bg:#04241B;--card:#0A382A;--ink:#F3E9CF;--muted:#A8C2B4;--green:#0F4D39;--green2:#E8CF86;--gold:#D6B25E;--line:#1B5A43;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.55;background:radial-gradient(circle at 70% -10%,#0E4A37 0,transparent 55%),radial-gradient(circle at 0 100%,#0A3A2B 0,transparent 50%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:"Marcellus",Georgia,serif;font-weight:700;margin:0}
h2{font-size:28px;line-height:1.2;color:var(--green2)}
.shell{display:flex;min-height:100vh}
main{flex:1;min-width:0}
#side{display:none}
.top{position:relative;display:flex;gap:10px;align-items:center;max-width:1100px;margin:0 auto;padding:14px 16px 0}
.sbox{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--gold);border-radius:30px;padding:0 18px;height:48px;background:rgba(4,36,27,.75);color:var(--gold);font-size:20px}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px}
.sbox input::placeholder{color:var(--muted)}
.gear{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:rgba(4,36,27,.75);color:var(--green2);font-size:22px;cursor:pointer}
#pop{position:absolute;right:16px;top:70px;display:none;gap:6px;align-items:center;background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;z-index:9;color:var(--muted);font-size:13px}
#pop.open{display:flex}
#app{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
.hero2{position:relative;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);min-height:400px;border:1px solid rgba(214,178,94,.55);border-radius:20px;overflow:hidden;background:radial-gradient(circle at 70% 30%,#0F5B43,#063022 70%)}

.htxt{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px}
.hero2 h1{margin:8px 0 6px;font-family:"Cinzel",Georgia,serif;font-weight:600;font-size:clamp(18px,2.4vw,32px);letter-spacing:3px;text-transform:uppercase;color:#E5C16C;text-wrap:balance}
.tri{font-family:"Marcellus",Georgia,serif;font-size:clamp(17px,2vw,26px);letter-spacing:2px;margin:0}
.dv{display:flex;align-items:center;gap:8px;color:var(--gold);margin:14px 0;width:70%}
.dv i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.dv i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.quote{font-family:"Marcellus",Georgia,serif;font-style:italic;font-size:clamp(16px,1.9vw,24px);margin:0;color:#F1E3BC}
.mand{filter:drop-shadow(0 0 6px rgba(227,200,118,.45))}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}@media(min-width:600px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:900px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ccard{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 8px 10px;border:1px solid var(--gold);border-radius:14px;background:linear-gradient(180deg,#0C4231,#07291F);color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 3px #07291F,inset 0 0 0 4px rgba(214,178,94,.35)}
.ccard:hover{box-shadow:0 0 18px rgba(214,178,94,.3),inset 0 0 0 3px #07291F,inset 0 0 0 4px rgba(214,178,94,.6)}
.ccard b{font-family:"Marcellus",Georgia,serif;font-weight:600;font-size:18px;line-height:1.15;text-align:center}
.ccard span{color:var(--gold);font-size:10px}

.logo{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 14px}
.brand{font-family:"Cinzel",Georgia,serif;font-weight:600;font-size:19px;line-height:1.3;letter-spacing:3px;color:#E5C16C;margin-top:6px}
.menu{display:flex;flex-direction:column;gap:4px}
.mi{display:flex;align-items:center;gap:12px;border:1px solid transparent;background:none;color:var(--ink);font-family:"Marcellus",Georgia,serif;font-weight:600;font-size:18px;padding:9px 12px;border-radius:12px;text-align:left;cursor:pointer}
.mi i{font-style:normal;color:var(--gold);width:22px;text-align:center;font-size:18px}
.mi.on{background:linear-gradient(180deg,#14583F,#0D4331);border-color:var(--gold)}
.mi:hover{background:rgba(214,178,94,.08)}
.sorn{margin-top:auto;text-align:center;color:var(--gold);padding-top:14px;letter-spacing:4px}
.sec{font-family:"Marcellus",Georgia,serif;font-weight:700;font-size:17px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.card:hover{border-color:var(--gold);box-shadow:0 0 14px rgba(214,178,94,.25)}
.card b{font-family:"Marcellus",Georgia,serif;font-weight:700;font-size:20px}
.card small{color:var(--muted);display:block}
.card.prem{border-color:var(--gold);background:linear-gradient(135deg,#0F4D39,var(--card))}
.badge{display:inline-block;font-family:"DM Sans",sans-serif;font-size:11px;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:12px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--green);color:var(--green2);border-color:var(--gold)}
button{font-family:inherit}
.btn{background:linear-gradient(135deg,#14583F,#0B3A2B);color:var(--green2);border:1px solid var(--gold);border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;border-color:var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.arabic{direction:rtl;text-align:right;font-family:"LPMQ Isep Misbah","Amiri","Scheherazade New","Traditional Arabic","Geeza Pro","Noto Naskh Arabic",serif;line-height:2.3;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--gold);border-radius:12px;padding:14px 18px}
.arabic p{margin:0 0 6px}
.blk{margin-top:14px}.blk h3{font-size:16px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}.blk p{margin:0 0 6px}
.rumi{font-family:"Marcellus",Georgia,serif;font-style:italic;font-weight:500;font-size:20px}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--gold);border-radius:10px;padding:8px 12px;margin:14px 0}
.empty{color:var(--muted);text-align:center;padding:24px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}.plan.gold{border-color:var(--gold);box-shadow:0 0 16px rgba(214,178,94,.2)}
.plan h3{font-size:20px;color:var(--gold);letter-spacing:1px;margin-bottom:6px}.plan ul{margin:0 0 8px;padding-left:18px}
.ok{color:var(--green2)}
.tagl{font-family:"Marcellus",Georgia,serif;font-style:italic;font-size:20px;text-align:center;color:var(--green2);margin:20px 0 0}
.bio{text-align:center;color:var(--muted);max-width:560px;margin:6px auto 0;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(4,36,27,.97);border-top:1px solid var(--gold);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;box-shadow:0 -8px 24px rgba(0,0,0,.4)}
nav button{flex:1;max-width:190px;background:none;border:0;color:var(--muted);padding:10px 4px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--green2);font-weight:bold}
@media(max-width:700px){.hero2{grid-template-columns:1fr;min-height:0}.scene{height:230px;-webkit-mask-image:linear-gradient(180deg,#000 65%,transparent);mask-image:linear-gradient(180deg,#000 65%,transparent)}.deco{display:none}}

.strip{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ccard{min-height:128px;padding:10px 4px 8px;border-radius:12px}
.ic{width:62px;height:70px}
.ccard b{font-size:13px}
.qs{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:200px;margin-top:16px;padding:30px 24px}
.qs::before,.qs::after{content:"";position:absolute;top:0;bottom:0;width:36%;background-size:cover;background-repeat:no-repeat;pointer-events:none}
.qs::before{left:0;background-image:url(data:image/jpeg;base64,);background-position:left center;-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent);mask-image:linear-gradient(90deg,#000 45%,transparent)}
.qs::after{right:0;background-image:url(data:image/jpeg;base64,);background-position:right center;-webkit-mask-image:linear-gradient(270deg,#000 45%,transparent);mask-image:linear-gradient(270deg,#000 45%,transparent)}
.qs{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 78%,transparent);mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 78%,transparent)}
.qs>*{position:relative;z-index:1}.qs .quote{max-width:230px;font-size:20px}.qs .dv{width:50%}
nav{left:8px;right:8px;bottom:8px;border:1px solid rgba(214,178,94,.5);border-radius:22px;background:linear-gradient(180deg,#0A3A2B,#06291E)}
nav button{position:relative;padding:10px 2px 14px;font-size:12px;color:#E9DDB8}
nav button .ico{display:block;margin:0 auto 3px}
nav button.on{color:#F1D58B;font-weight:400}
nav button.on::after{content:"";position:absolute;left:24%;right:24%;bottom:5px;height:3px;border-radius:3px;background:var(--gold)}
h1,h2,h3,.sec,.card b,.ccard b,.mi,.tri,.quote,.tagl,.plan h3,.blk h3{font-weight:400!important}
.hero2 h1,.mh h1,.brand{font-weight:600!important}
.quote,.tagl{font-style:italic}
.rumi{font-family:"DM Sans",system-ui,sans-serif;font-style:italic;font-weight:400;font-size:17px}
@media(min-width:600px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:900px){
.top{display:flex}.mbar,.mh,.qs{display:none}.hero2{display:grid}
.strip{gap:10px}.ccard{min-height:190px;padding:12px 8px 10px;border-radius:14px}.ic{width:96px;height:108px}.ccard b{font-size:18px}}
@media(min-width:1200px){.strip{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(max-width:899px){.sbox.msearch{display:flex}}
@media(min-width:900px){.sbox.msearch{display:none}}
.card.sub{margin-left:24px;width:calc(100% - 24px);padding:10px 14px}

:root{--bg:#FBF4EE;--card:#FFFCF9;--ink:#3B2A42;--muted:#7D6A80;--green:#EADCF4;--green2:#6B3F63;--gold:#C08B7A;--line:#E8D5E0}
body{background:radial-gradient(circle at 80% -10%,#EADFF5 0,transparent 55%),radial-gradient(circle at 0 100%,#F9DDE2 0,transparent 50%),var(--bg);background-attachment:fixed}
h2{color:var(--green2)}
#side{background:linear-gradient(180deg,#FFFAF6,#F6EAF2);box-shadow:0 10px 30px rgba(150,100,130,.15),inset 0 0 0 4px #FFFAF6,inset 0 0 0 5px rgba(192,139,122,.4)}
.brand{color:var(--green2)}
.mi:hover{background:rgba(192,139,122,.12)}
.mi.on{background:linear-gradient(90deg,#EADCF4,#F7E3E8);border-color:rgba(192,139,122,.6)}
.sbox{background:linear-gradient(90deg,#F1E7F8,#F8E8EC);border-color:rgba(192,139,122,.5);color:var(--gold)}
.gear,.sbtn,.mbar>span{background:#F3E8F8;border-color:rgba(192,139,122,.5);color:var(--green2)}
.hero2{background:linear-gradient(135deg,#FFF9F4,#F6E9F1);border-color:rgba(192,139,122,.45);box-shadow:0 10px 30px rgba(150,100,130,.12)}
.scene{-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)}
.deco{bottom:auto;top:0;height:50%;width:90px;background-position:top right;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.hero2 h1,.mh h1{background:linear-gradient(180deg,#8E5A8A,#B4687A 55%,#C48C70);-webkit-background-clip:text;background-clip:text;color:transparent}
.tri{font-family:"DM Sans",system-ui,sans-serif;text-transform:uppercase;letter-spacing:4px;font-size:clamp(11px,1.3vw,15px);color:var(--green2)}
.mh .tri{font-size:clamp(10px,3vw,13px);letter-spacing:3px}
.quote{color:var(--green2)}
.dv{color:var(--gold)}
.mh{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><path d='M22 3l3.5 15.5L41 22l-15.5 3.5L22 41l-3.5-15.5L3 22l15.5-3.5z' fill='none' stroke='%23C08B7A' stroke-opacity='.22'/></svg>");background-color:#F4EAF7;border-radius:140px 140px 0 0/90px 90px 0 0;border:1px solid rgba(192,139,122,.35);border-bottom:0}
.arch{aspect-ratio:433/295;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 92%,transparent);mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 92%,transparent)}
.qs{-webkit-mask-image:none;mask-image:none;min-height:130px;margin-top:12px;border-radius:20px;background:radial-gradient(ellipse at 50% 0,#F3E8F8,#FBEBEE)}
.qs::before,.qs::after{display:none}
.strip{display:flex;overflow-x:auto;gap:10px;scroll-snap-type:x proximity;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.ccard{flex:0 0 112px;scroll-snap-align:start;background:linear-gradient(180deg,#F3EAF9,#FBE7EA);border:1px solid rgba(192,139,122,.55);box-shadow:0 6px 16px rgba(150,100,130,.12)}
.ccard:hover{box-shadow:0 8px 22px rgba(192,139,122,.35)}
@media(min-width:900px){.ccard{flex:0 0 132px}}
.card{background:var(--card);box-shadow:0 2px 10px rgba(150,100,130,.07)}
.card:hover{box-shadow:0 6px 18px rgba(192,139,122,.25)}
.card.prem{background:linear-gradient(135deg,#F1E6F8,#FBE4E8);border-color:var(--gold)}
.chip.on{background:var(--green);color:var(--green2)}
.btn{background:linear-gradient(135deg,#E9DAF4,#F7DADF);color:#5A3358}
.plan.gold{box-shadow:0 0 16px rgba(192,139,122,.25)}
.sec,.badge,.blk h3,.plan h3{color:#A9695F}
.badge{border-color:var(--gold)}
nav{background:linear-gradient(180deg,#FFFAF6,#F5E9F2);border-color:rgba(192,139,122,.5);box-shadow:0 -6px 20px rgba(150,100,130,.15)}
nav button{color:#7D6A80}nav button.on{color:var(--green2)}
nav button.on::after{background:var(--gold)}
.mand{filter:drop-shadow(0 0 4px rgba(192,139,122,.35))}
.arabic{background:#FFFDFA;border-right-color:var(--gold)}
.note{background:rgba(243,232,248,.45)}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow:visible;scroll-snap-type:none}
.ccard{flex:none;min-width:0}
@media(min-width:600px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:900px){.strip{gap:10px}}
@media(min-width:1200px){.strip{grid-template-columns:repeat(8,minmax(0,1fr))}}
.ent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:0 2px 10px rgba(150,100,130,.07)}.ent>h3{color:var(--green2);font-size:19px;margin:0 0 10px}.ent .arabic{margin:0 0 10px}.cnt{margin:8px 0;color:var(--green2)}
.mbar{display:none!important}
.ah,.aud,.mpill,.mo{display:none}.dk{display:block}
.mh .ln{position:absolute;top:70px;width:58px;height:150px;background-size:cover;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent);mask-image:radial-gradient(closest-side,#000 55%,transparent)}

var WIRD=[
{n:1,t:"NIAT MEMBACA WIRID AM",b:[["a",["اللَّهُمَّ إِنِّي نَوَيْتُ أَنْ أَتَقَرَّبَ إِلَيْكَ بِقِرَاءَةِ الْوِرْدِ الْعَامِّ لِلطَّرِيقَةِ الشَّاذِلِيَّةِ الدَّرْقَاوِيَّةِ الْعَلَوِيَّةِ الْحَسَنِيَّةِ، امْتِثَالًا لِأَمْرِكَ وَاتِّبَاعًا لِنَبِيِّكَ مُحَمَّدٍ (صَلَوَاتُكَ وَسَلَامُكَ عَلَيْهِ وَعَلَى آلِهِ)، وَوَفَاءً بِالْعَهْدِ الَّذِي أَخَذَ عَلَيَّ، تَعَبُّدًا لِلَّهِ."]],["m","Ya Allah, sesungguhnya aku berniat untuk mendekatkan diriku kepadaMu dengan membaca wirid am Tariqah Al-Syadhiliyyah Al-Darqawiyyah Al-Alawiyyah Al-Hasaniyyah untuk melazimi perintahMu dan mengikuti petunjuk NabiMu Muhammad (Selawat rahmatMu dan Salam Kesejahteraan dariMu ke atas Baginda dan ahli keluarganya) serta demi memenuhi janji setia yang telah diambil ke atasku, sebagai ibadah kepadaMu ya Allah."],["d","اللَّهُ"],["c","Minimum 10 times."]]},
{n:2,t:"TA‘AWWUZ",b:[["a",["أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ"]],["m","Aku berlindung denganMu Ya Allah daripada (gangguan dan tipu daya) syaitan yang direjam."]]},
{n:3,t:"BASMALAH",b:[["a",["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"]],["c","3 times."],["m","Dengan nama Allah yang Maha Pengasih lagi Maha Penyayang."]]},
{n:4,t:"SURAH NUH, VERSES 10–12",b:[["a",["فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا ۝١٠","يُرْسِلِ السَّمَاءَ عَلَيْكُمْ مِدْرَارًا ۝١١","وَيُمْدِدْكُمْ بِأَمْوَالٍ وَبَنِينَ وَيَجْعَلْ لَكُمْ جَنَّاتٍ وَيَجْعَلْ لَكُمْ أَنْهَارًا ۝١٢"]],["m","Lalu aku (Nabi Nuh a.s.) berkata, “Minta ampunlah kalian kepada Allah, sesungguhnya Dia Maha Pengampun. Nescaya Dia akan mengirimkan hujan yang lebat kepada kalian, dan menolong kalian dengan harta benda dan anak-anak, serta mengadakan kebun-kebun dan beberapa sungai untuk kalian.”"],["r","Surah Nuh, 71:10–12."]]},
{n:5,t:"ISTIGHFAR",b:[["a",["أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ"]],["c","99 times."],["m","Aku memohon keampunan kepadaMu ya Allah Yang Maha Agung, yang mana tiada Tuhan selain Dia, Yang Hidup lagi Berdiri (memelihara semesta alam)."]]},
{t:"ISTIGHFAR AND REPENTANCE",b:[["a",["أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ"]],["m","Aku memohon keampunan kepadaMu ya Allah Yang Maha Agung, yang mana tidak ada Tuhan selain Dia, Yang Hidup lagi Berdiri (memelihara semesta alam), dan aku bertaubat (kembali) kepadaNya."]]},
{n:6,t:"SELAWAT FROM SURAH AL-AHZAB, VERSE 56",b:[["a",["إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا"]],["m","Sesungguhnya Allah dan para malaikatNya berselawat ke atas Nabi Muhammad ﷺ. Wahai orang-orang yang beriman, berselawatlah kalian ke atas Baginda ﷺ dan ucapkanlah salam dengan salam yang sempurna."],["r","Surah al-Ahzab, 33:56."]]},
{n:7,t:"FIRST SELAWAT",b:[["a",["اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ"]],["c","99 times."],["m","Ya Allah, limpahkanlah selawat (rahmat) ke atas junjungan kami Muhammad, juga ke atas keluarga Baginda dan para sahabatnya dengan salam kesejahteraan."]]},
{n:8,t:"SECOND SELAWAT",b:[["a",["اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ تَسْلِيمًا كَثِيرًا، بِقَدْرِ عَظَمَةِ ذَاتِكَ فِي كُلِّ وَقْتٍ وَحِينٍ"]],["m","Ya Allah, limpahkanlah selawat (rahmat) ke atas junjungan kami Muhammad, juga ke atas keluarga Baginda dan para sahabatnya dengan salam kesejahteraan yang sebanyak-banyaknya seluas kadar keagunganMu pada setiap waktu dan ketika."]]},
{n:9,t:"ISTIGHFAR FROM SURAH MUHAMMAD, VERSE 19",b:[["a",["فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ وَاسْتَغْفِرْ لِذَنْبِكَ"]],["m","Maka ketahuilah (Muhammad) bahawa sesungguhnya tidak ada Tuhan melainkan Allah, dan mohonlah keampunan kepadaNya untuk dosamu."],["r","Surah Muhammad, 47:19."]]},
{n:10,t:"TAHLIL",b:[["a",["لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ"]],["c","99 times."],["m","Tiada Tuhan melainkan Allah Yang Esa, tiada sekutu bagiNya."]]},
{t:"COMPLETE TAHLIL",b:[["a",["لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ"]],["m","Tiada Tuhan melainkan Allah Yang Esa, tiada sekutu bagiNya. BagiNya segala kekuasaan dan bagiNya segala pujian. Dia yang menghidupkan dan mematikan, dan Dia Maha Kuasa atas tiap-tiap sesuatu."]]},
{n:11,t:"SURAH AL-IKHLAS",b:[["a",["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","قُلْ هُوَ اللَّهُ أَحَدٌ ۝١","اللَّهُ الصَّمَدُ ۝٢","لَمْ يَلِدْ وَلَمْ يُولَدْ ۝٣","وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ۝٤"]],["c","3 times."],["m","Katakanlah (Ya Muhammad): Dialah Allah Yang Maha Esa. Allah yang dituju (untuk meminta hajat). Dia tidak beranak dan tidak pula diperanakkan. Dan tidak ada satu pun yang menyerupaiNya."]]},
{n:12,t:"SAYYID AL-ISTIGHFAR",b:[["a",["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ"]],["m","Ya Allah, Engkaulah Rabbku. Tiada Tuhan selain Engkau yang menciptakanku. Aku adalah hambaMu, aku usahakan menurut setiap perintahMu semampu dayaku. Aku berlindung denganMu daripada kejahatan yang telah aku perbuat. Aku mengakui segala nikmatMu ke atasku datang daripadaMu, dan aku mengakui pula segala dosaku. Maka ampunilah aku ya Allah kerana sesungguhnya tiadalah yang dapat mengampuni dosa melainkan Engkau."]]},

function saved(){
 var l=S.marks.map(byId).filter(Boolean);
 return '<h2>'+t("fav")+'</h2><div style="height:10px"></div>'+(l.length?l.map(row).join(''):'<div class="empty">'+t("nomarks")+'</div>')}

function premium(){
 var li=function(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'};
 var h='<h2>♛ '+t("prem")+badge(t("demo"))+'</h2><div class="note">'+t("pnote")+'</div>';
 h+='<div class="plan"><h3>'+t("free")+'</h3>'+li(TX[S.lang].fl)+'</div>';
 h+='<div class="plan gold"><h3>'+t("prem")+'</h3>'+li(TX[S.lang].pl)+'<small style="color:var(--muted)">'+t("price")+'</small></div>';
 h+=S.prem?'<p class="ok">✓ '+t("act")+'</p><button class="btn ghost" onclick="setPrem(false)">'+t("cancel")+'</button>':'<button class="btn" onclick="setPrem(true)">'+t("up")+'</button>';
 return h}

function read(){
 var i=byId(S.item),m=S.marks.indexOf(i.id)>=0;
 var h='<div class="bar"><button class="btn ghost" onclick="go(\'library\')">'+t("back")+'</button><button class="btn" onclick="toggleMark(\''+i.id+'\')">'+(m?t("marked"):t("mark"))+'</button></div>';
 h+='<h2>'+i.t[S.lang]+stat(i)+'</h2><small style="color:var(--muted)">'+cn(i.cat)+'</small><div class="note">'+(i.pending?t("pn"):i.ok?t("sup"):i.draft?t("dn")+(i.cov?" "+i.cov[S.lang]:""):t("sn"))+'</div>';
 if(i.pending)return h;
 h+='<div class="aud"><span>▶</span><span>■</span><span>⟳</span><em>'+t("aud")+'</em></div>';
 if(i.entries){
  if(i.by)h+='<p class="by">'+i.by+'</p>';
  h+='<div class="tools"><span>'+t("size")+'</span><button class="chip" onclick="setSize(-4)">A−</button><b>'+S.size+'</b><button class="chip" onclick="setSize(4)">A+</button><button class="chip'+(S.showMal?' on':'')+'" onclick="toggle(\'showMal\',\'mq_mal\')">'+t("mal")+'</button></div>';
  var AR=function(a){return '<div class="arabic" lang="ar" dir="rtl" style="font-size:'+S.size+'px">'+(Array.isArray(a)?a.map(function(x){return '<p>'+x+'</p>'}).join(''):a)+'</div>'};
  i.entries.forEach(function(e){
   h+='<section class="ent"><h3>'+(e.n?e.n+'. ':'')+e.t+'</h3>';
   e.b.forEach(function(x){var k=x[0],v=x[1];
    if(k==="a")h+=AR(v);
    else if(k==="h")h+='<p class="ah2" lang="ar" dir="rtl">'+v+'</p>';
    else if(k==="d")h+='<p class="cnt"><b>'+t("dhk")+':</b></p>'+AR(v);
    else if(k==="c")h+='<p class="cnt"><b>'+t("cnt")+':</b> '+v+'</p>';
    else if(k==="r")h+='<p class="cnt"><b>'+t("ref")+':</b> '+v+'</p>';
    else if(k==="i")h+='<p class="cnt">'+v+'</p>';
    else if(k==="m"&&S.showMal)h+='<div class="blk"><h3>'+t("malH")+'</h3><p>'+(Array.isArray(v)?v.join('</p><p>'):v)+'</p></div>'});
   h+='</section>'});
  return h}
 if(i.parts){
  if(i.by)h+='<p class="by">'+i.by+'</p>';
  h+='<div class="tools"><span>'+t("size")+'</span><button class="chip" onclick="setSize(-4)">A−</button><b>'+S.size+'</b><button class="chip" onclick="setSize(4)">A+</button><button class="chip'+(S.showMal?' on':'')+'" onclick="toggle(\'showMal\',\'mq_mal\')">'+t("mal")+'</button></div>';
  i.parts.forEach(function(p){h+='<div class="sec">'+p.h+'</div>'+p.lines.map(function(l){return '<div class="ln"><div class="arabic" lang="ar" dir="rtl" style="font-size:'+S.size+'px">'+l.a+'</div>'+(S.showMal?'<p class="msl">'+l.m+'</p>':'')+'</div>'}).join('')});
  return h}
 h+='<div class="tools"><span>'+t("size")+'</span><button class="chip" onclick="setSize(-4)">A−</button><b>'+S.size+'</b><button class="chip" onclick="setSize(4)">A+</button>'+
  '<button class="chip'+(S.showRumi?' on':'')+'" onclick="toggle(\'showRumi\',\'mq_rumi\')">'+t("rumi")+'</button><button class="chip'+(S.showMal?' on':'')+'" onclick="toggle(\'showMal\',\'mq_mal\')">'+t("mal")+'</button></div>';
 h+='<div class="arabic fr" lang="ar" dir="rtl" style="font-size:'+S.size+'px">'+i.ar.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>';
 if(S.showRumi)h+='<div class="blk"><h3>'+t("rumiH")+'</h3>'+i.rumi.map(function(x){return '<p class="rumi">'+x+'</p>'}).join('')+'</div>';
 if(S.showMal)h+='<div class="blk"><h3>'+t("malH")+'</h3>'+i.mal.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>';
 return h}

/* ===== 5. NAVIGATION + DRAWING ===== */
function togglePop(){S.pop=!S.pop;pop()}
function pop(){var p=document.getElementById("pop");p.className=S.pop?"open":"";p.innerHTML='<span>'+t("lang")+':</span><button class="chip'+(S.lang==="ms"?' on':'')+'" onclick="setLang(\'ms\')">BM</button><button class="chip'+(S.lang==="en"?' on':'')+'" onclick="setLang(\'en\')">EN</button>'}
function side(){
 var cur=S.view==="read"?(byId(S.item)||{}).cat:(S.view==="library"&&S.cat!=="all"?S.cat:null);
 function it(on,i,label,fn){return '<button class="mi'+(on?' on':'')+'" onclick="'+fn+'"><i>'+i+'</i>'+label+'</button>'}
 var h='<div class="logo">'+mandala(64)+'<div class="brand">MAULID &amp;<br>QASIDAH</div></div><div class="menu">';
 h+=it(S.view==="home","⌂",t("home"),"go('home')")+it(S.view==="library"&&S.cat==="all","☰",t("lib"),"go('library',{cat:'all'})");
 CATEGORIES.forEach(function(c){h+=it(cur===c.id,c.icon,c.n[S.lang],"go('library',{cat:'"+c.id+"'})")});
 h+=it(S.view==="saved","♡",t("fav"),"go('saved')")+it(S.view==="recent","◷",t("recent"),"go('recent')")+it(S.view==="settings","⚙",t("setg"),"go('settings')")+it(S.view==="premium","♛",t("prem"),"go('premium')");
 document.getElementById("side").innerHTML=h+'</div><div class="sorn">— ◆ —</div>'}
function render(){
 var v=S.view,H='',it=v==="read"?byId(S.item):null,p=v==="group"?byId(S.g):null;
 document.documentElement.lang=S.lang;
 if(v==="library")H=S.cat==="all"?hdr({title:t("lib")}):hdr({back:"go('library',{cat:'all'})",title:cn(S.cat)});
 else if(p)H=hdr({back:"go('library',{cat:'"+p.cat+"'})",title:p.t[S.lang]});
 else if(it)H=hdr({back:it.par?"go('group',{g:'"+it.par+"'})":"go('library',{cat:'"+it.cat+"'})",menu:"toggleMark('"+it.id+"')",title:it.t[S.lang]});
 else if(v==="saved"||v==="more")H=hdr({title:v==="saved"?t("fav"):t("more")});
 else if(v!=="home")H=hdr({back:"go('more')",title:{search:t("search"),recent:t("recent"),settings:t("setg"),premium:t("prem")}[v]});
 document.getElementById("app").innerHTML=H+(v==="home"?home():v==="library"?library():v==="group"?group():v==="more"?more():v==="search"?search():v==="saved"?saved():v==="recent"?recent():v==="settings"?settings():v==="premium"?premium():read());
 if(v==="search"){doSearch(S.q);var q2=document.getElementById("sq");if(q2){q2.value=S.q;q2.placeholder=t("ph")}}
 var q=document.getElementById("tq");if(q.value!==S.q)q.value=S.q;q.placeholder=t("ph");
 side();pop();
 var tabs=[["home","home",t("home")],["library","grid",t("lib")],["saved","bm",t("fav")],["more","dots",t("more")]];
 var cur=v==="read"||v==="group"?"library":v==="search"||v==="recent"||v==="settings"||v==="premium"?"more":v;
 document.getElementById("nav").innerHTML=tabs.map(function(x){var on=cur===x[0];return '<button class="'+(on?'on':'')+'" onclick="go(\''+x[0]+'\')">'+ic(x[1],on)+x[2]+'</button>'}).join('');
}
render();
</script>
</body>
</html>
